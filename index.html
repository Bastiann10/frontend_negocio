<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logoweb_UTA.png" id="favicon-link" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LABODOP UTA - Portal de negocio</title>
    <style>
      /* Estilos críticos para evitar pantalla blanca - coinciden con Tailwind */
      html {
        background-color: #ffffff;
        color: #0f172a;
      }
      html.dark {
        background-color: #1a1a1a;
        color: #f5f5f5;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      }
      #root {
        min-height: 100vh;
      }

      /* Loading screen inicial */
      #initial-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      html.dark #initial-loading {
        background-color: #1a1a1a;
      }
      #initial-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .spinner {
        width: 64px;
        height: 64px;
        border: 4px solid #3b82f6;
        border-top: 4px solid transparent;
        border-right: 4px solid transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        box-sizing: border-box;
      }
      html.dark .spinner {
        border-color: #60a5fa;
        border-top-color: transparent;
        border-right-color: transparent;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('theme');
          let isDark = false;

          if (savedTheme === 'dark') {
            isDark = true;
          } else if (savedTheme === 'light') {
            isDark = false;
          } else {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }

          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          console.error('Error applying theme:', e);
        }
      })();
    </script>
    <script>
      // Cargar favicon dinámicamente desde el backend; fallback a /logoweb_UTA.png
      (function() {
        var API_BASE_URL = '%VITE_API_BASE_URL%';
        var faviconLink = document.getElementById('favicon-link');
        if (!faviconLink) return;

        fetch(API_BASE_URL + '/portal/configuracion/logo', { credentials: 'include' })
          .then(function(r) {
            if (!r.ok) throw new Error('Logo fetch failed: ' + r.status);
            var ct = r.headers.get('content-type') || '';
            if (ct.indexOf('image/') === 0) {
              return r.blob().then(function(b) { return URL.createObjectURL(b); });
            }
            return r.json().then(function(d) {
              var url = d.logo_url || d.logoUrl;
              if (!url) throw new Error('No logo_url in response');
              return url.indexOf('http') === 0 ? url : API_BASE_URL + url;
            });
          })
          .then(function(url) {
            var img = new Image();
            img.onload = function() { faviconLink.href = url; };
            img.onerror = function() { /* fallback queda como logoweb_UTA.png */ };
            img.src = url;
          })
          .catch(function() { /* fallback queda como logoweb_UTA.png */ });
      })();
    </script>
  </head>
  <body>
    <div id="initial-loading">
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
